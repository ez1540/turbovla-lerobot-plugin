[build-system]
requires = ["setuptools>=71.0.0,<82.0.0"]
build-backend = "setuptools.build_meta"

[project]
# The `lerobot_policy_` prefix is load-bearing, not cosmetic: LeRobot discovers third-party
# policies by walking installed distributions and importing every one whose name starts with it
# (see `lerobot.utils.import_utils.register_third_party_plugins`). There is no entry-point group.
# The distribution name is imported verbatim as a module, so it must also be the package name.
name = "lerobot_policy_turbovla"
version = "0.1.0"
description = "TurboVLA as a drop-in LeRobot policy: --policy.type=turbovla"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["robotics", "lerobot", "vla", "imitation-learning", "turbovla"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: `torch` is deliberately absent. On the ROCm box this plugin was developed on, torch is a
# ROCm nightly that no PyPI resolver can reproduce, and letting pip resolve a torch requirement is
# the single most likely way to break that setup — it will happily install a CUDA build over it.
# Whatever torch is already in the environment is the one we use.
dependencies = [
    "lerobot>=0.6.0",
    "transformers>=5.4.0,<5.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.1.0,<10.0.0"]

[project.urls]
Homepage = "https://github.com/H-EmbodVis/TurboVLA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
